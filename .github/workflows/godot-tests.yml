name: Godot tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gut:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Godot and addons
        run: ./tools/bootstrap.ps1
      - name: Run GUT unit and integration suites
        run: ./tools/test.ps1
      - name: Upload logs and JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-test-results
          path: |
            .godot/test-results/**/*.log
            .godot/test-results/**/*.xml
          include-hidden-files: true
          if-no-files-found: ignore
